[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "campermit"
version = "0.1.0.dev0"
description = "Enable and disable USB webcams on Linux from the command line"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
campermit = "campermit.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "ruff"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]